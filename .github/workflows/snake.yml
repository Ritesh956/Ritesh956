{
  "name": "Generate contribution snake",
  "on": {
    "push": { "branches": ["main"] },
    "workflow_dispatch": {},
    "schedule": [{ "cron": "0 0 * * *" }]
  },
  "permissions": { "contents": "write" },
  "jobs": {
    "generate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "Platane/snk@v3",
          "with": {
            "github_user_name": "${{ github.repository_owner }}",
            "outputs": "dist/github-snake.svg?color_snake=#FF2E97\ndist/github-snake-dark.svg?palette=github-dark&color_snake=#00FFFF&color_dots=#161b22,#4a0f33,#8a1a5a,#c92679,#FF2E97"
          }
        },
        {
          "uses": "crazy-max/ghaction-github-pages@v4",
          "with": { "target_branch": "output", "build_dir": "dist" },
          "env": { "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}" }
        }
      ]
    }
  }
}
